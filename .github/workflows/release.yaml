name: Release & Publish GTFS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      timetable_version:
        description: "Timetable version to compile (digits only; defaults to latest on disk)"
        required: false
        type: string
      allow_provisional:
        description: "Allow provisional calendar (<3 day types)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Release
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history for archive_commit resolution

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Compile Database and GTFS Package
        id: prep
        env:
          TT_VERSION: ${{ inputs.timetable_version }}
          ALLOW_PROVISIONAL: ${{ inputs.allow_provisional }}
        run: |
          set -euo pipefail

          # --- Validate timetable_version (digits only, max 6 digits) ---
          VERSION_FLAG=""
          if [ -n "$TT_VERSION" ]; then
            if ! [[ "$TT_VERSION" =~ ^[0-9]{1,6}$ ]]; then
              echo "::error::Invalid timetable_version '${TT_VERSION}'. Must be 1–6 digits."
              exit 1
            fi
            VERSION_FLAG="$TT_VERSION"
          fi

          # --- Build flags ---
          FLAGS=""
          if [ "$ALLOW_PROVISIONAL" = "true" ]; then
            FLAGS="--allow-provisional"
          fi

          echo "Running: bun run scripts/release-prepare.ts $VERSION_FLAG $FLAGS"
          bun run scripts/release-prepare.ts $VERSION_FLAG $FLAGS

          # --- Discover artifacts deterministically ---
          # The release-prepare script prints "ARTIFACT_VERSION=<n>" on stdout.
          RESOLVED_VERSION=$(grep -oP 'ARTIFACT_VERSION=\K[0-9]+' /tmp/release-prep-output.txt || true)

          if [ -z "$RESOLVED_VERSION" ]; then
            # Fallback: parse from the script's own stdout captured above
            RESOLVED_VERSION=$(grep -oP 'Timetable Edition: v\K[0-9]+' /tmp/release-prep-output.txt || echo "")
          fi

          if [ -z "$RESOLVED_VERSION" ]; then
            echo "::error::Could not determine resolved timetable version from build output."
            exit 1
          fi

          DB_FILE="data/build/krl_v${RESOLVED_VERSION}.db"
          ZIP_FILE="data/build/krl_gtfs_v${RESOLVED_VERSION}.zip"
          SHA_FILE="${ZIP_FILE}.sha256"
          NOTES_FILE="data/build/RELEASE_NOTES_v${RESOLVED_VERSION}.md"

          # --- Verify all artifacts exist ---
          for f in "$DB_FILE" "$ZIP_FILE" "$SHA_FILE" "$NOTES_FILE"; do
            if [ ! -f "$f" ]; then
              echo "::error::Expected artifact not found: $f"
              exit 1
            fi
          done

          echo "db_file=$DB_FILE" >> "$GITHUB_OUTPUT"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "sha_file=$SHA_FILE" >> "$GITHUB_OUTPUT"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "resolved_version=$RESOLVED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Determine Release Tag & Name
        id: release_meta
        env:
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          RESOLVED_VERSION: ${{ steps.prep.outputs.resolved_version }}
        run: |
          set -euo pipefail

          if [[ "$REF" == refs/tags/* ]]; then
            TAG_NAME="$REF_NAME"
          else
            TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
            TAG_NAME="release-v${RESOLVED_VERSION}-${TIMESTAMP}"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: KRL Timetable Release (${{ steps.release_meta.outputs.tag_name }})
          body_path: ${{ steps.prep.outputs.notes_file }}
          draft: false
          prerelease: ${{ inputs.allow_provisional == true }}
          files: |
            ${{ steps.prep.outputs.zip_file }}
            ${{ steps.prep.outputs.sha_file }}
            ${{ steps.prep.outputs.db_file }}